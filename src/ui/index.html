<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RE4R ShapeKey Studio</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <!-- ============================================================ setup -->
  <section id="setup" class="view">
    <header class="topbar">
      <div class="brand"><img src="Studio_icon.png" alt=""><div><span>RE4R ShapeKey Studio</span><small data-i18n="app_sub"></small></div></div>
      <div class="spacer"></div>
      <button class="ghost icon-btn" id="themeBtn1" data-action="theme" title=""><svg viewBox="0 0 24 24"><use href="#i-theme"/></svg></button>
      <button class="ghost chip-btn" data-action="lang">中文 / EN</button>
    </header>
    <div class="setup-body">
      <aside class="stepper">
        <div class="step" data-step="1"><b>1</b><span data-i18n="step_dir"></span></div>
        <div class="step" data-step="2"><b>2</b><span data-i18n="step_install"></span></div>
        <div class="step" data-step="3"><b>3</b><span data-i18n="step_capture"></span></div>
        <div class="stepper-foot" id="setupVersion"></div>
      </aside>
      <main class="setup-main">
        <h1 data-i18n="setup_title"></h1>
        <p class="lead" data-i18n="setup_lead"></p>
        <div class="setup-grid">
          <div class="col">
            <article class="card rise">
              <h2 data-i18n="dir_title"></h2>
              <p class="muted" data-i18n="dir_hint"></p>
              <div class="field"><input id="dirInput" spellcheck="false" placeholder="D:\SteamLibrary\steamapps\common\RESIDENT EVIL 4  BIOHAZARD RE4"></div>
              <div class="row2">
                <button class="primary" data-action="browse"><svg viewBox="0 0 24 24"><use href="#i-folder"/></svg><span data-i18n="browse"></span></button>
                <button class="secondary" data-action="validate"><svg viewBox="0 0 24 24"><use href="#i-check"/></svg><span data-i18n="validate"></span></button>
              </div>
              <div class="state-box" id="dirState"><span class="dot"></span><span id="dirStateText"></span></div>
            </article>
            <article class="card rise">
              <h2 data-i18n="install_title"></h2>
              <p class="muted pre" data-i18n="install_hint"></p>
              <button class="primary wide" id="installBtn" data-action="install"><span class="spinner"></span><span id="installText" data-i18n="install_btn"></span></button>
            </article>
          </div>
          <div class="col">
            <article class="card rise receiver-card" id="receiverCardSetup"></article>
          </div>
        </div>
        <footer class="setup-foot">
          <p class="muted" id="setupMsg"></p>
          <button class="primary enter" id="enterBtn" data-action="enter"><span data-i18n="enter"></span><svg viewBox="0 0 24 24"><use href="#i-arrow"/></svg></button>
        </footer>
      </main>
    </div>
  </section>

  <!-- ============================================================ workbench -->
  <section id="bench" class="view hidden">
    <header class="topbar">
      <div class="brand"><img src="Studio_icon.png" alt=""><div><span>RE4R ShapeKey Studio</span><small data-i18n="app_sub"></small></div></div>
      <div class="model-chip"><img src="Studio_icon.png" alt=""><div><span id="modelName">—</span><small id="modelCount"></small></div></div>
      <div class="conn" id="conn"><span class="dot"></span><div><span id="connText"></span><small id="connSub"></small></div></div>
      <div class="spacer"></div>
      <div class="select" id="sourceSelect">
        <button class="select-btn" data-action="source-open"><small data-i18n="source"></small><span id="sourceText"></span><svg viewBox="0 0 24 24"><use href="#i-chevron"/></svg></button>
        <div class="select-pop" id="sourcePop"></div>
      </div>
      <div class="gain"><small data-i18n="strength"></small><div class="mini-slider" id="gainSlider"></div><span class="num" id="gainText">1.00</span></div>
      <button class="control-btn" id="controlBtn" data-action="control"><svg viewBox="0 0 24 24"><use href="#i-play"/></svg><span id="controlText"></span></button>
      <button class="ghost icon-btn" id="pinBtn" data-action="topmost" data-i18n-title="topmost" aria-pressed="false"><svg viewBox="0 0 24 24"><use href="#i-pin"/></svg></button>
      <button class="ghost icon-btn" data-action="theme" data-i18n-title="theme"><svg viewBox="0 0 24 24"><use href="#i-theme"/></svg></button>
      <button class="ghost chip-btn" data-action="lang"><svg viewBox="0 0 24 24"><use href="#i-globe"/></svg><span id="langText"></span></button>
    </header>
    <div class="bench-body">
      <nav class="sidebar" id="nav">
        <div class="nav-scroll" id="navScroll"><div class="nav-pill" id="navPill"></div><div id="navItems"></div></div>
        <div class="nav-bottom">
          <button class="conn-card" id="connCard" data-action="page" data-page="diag"><span class="dot"></span><div><b id="connCardText"></b><small id="connCardSub"></small></div></button>
          <div class="ver" id="verText"></div>
        </div>
      </nav>
      <main class="content">
        <div class="content-head">
          <div class="page-icon" id="pageIcon"></div>
          <div class="title-wrap"><h1 id="pageTitle"></h1><p class="muted" id="pageSub"></p></div>
          <div class="head-actions" id="headActions">
            <button class="secondary sm" data-action="zero-page"><svg viewBox="0 0 24 24"><use href="#i-reset"/></svg><span data-i18n="zero_page"></span></button>
            <button class="secondary sm" data-action="copy"><svg viewBox="0 0 24 24"><use href="#i-copy"/></svg><span data-i18n="copy"></span></button>
            <button class="secondary sm" data-action="paste"><svg viewBox="0 0 24 24"><use href="#i-paste"/></svg><span data-i18n="paste"></span></button>
          </div>
        </div>
        <div class="subhead"><label class="search"><svg viewBox="0 0 24 24"><use href="#i-search"/></svg><input id="search" spellcheck="false"></label><span class="badge" id="pageBadge"></span><span class="hint" id="ownHint"></span><span class="spacer"></span><div class="sub-actions" id="subActions"><button class="secondary toggle sm" id="compareBtn" data-action="compare"><svg viewBox="0 0 24 24"><use href="#i-compare"/></svg><span data-i18n="compare"></span></button><button class="secondary toggle sm" id="sweepBtn" data-action="sweep"><svg viewBox="0 0 24 24"><use href="#i-sweep"/></svg><span data-i18n="sweep"></span></button></div></div>
        <div class="page-host" id="pageHost"><div class="page" id="page"></div></div>
      </main>
      <aside class="inspector">
        <div class="portrait"><img src="Studio_icon.png" alt=""><div class="portrait-name" id="portraitName">—</div></div>
        <div class="card detail" id="detail"></div>
      </aside>
    </div>
  </section>
</div><div id="toasts"></div>

</html>
